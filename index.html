<!DOCTYPE html>
<html>
<head>
<title>Smart Financial Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg1:#eef2ff; --bg2:#e0f7fa; --card:#ffffff; --text:#0f172a; --muted:#6b7280;
  --primary:#6366f1; --accent:#06b6d4; --good:#16a34a; --bad:#dc2626;
}
body.dark{
  --bg1:#0b1220; --bg2:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af;
}
body{margin:0;font-family:'Segoe UI';display:flex;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2));}

.sidebar{width:230px;background:linear-gradient(180deg,#4f46e5,#6366f1);color:#fff;height:100vh;padding:20px;position:sticky;top:0}
.sidebar h2{text-align:center;margin-bottom:20px}
.sidebar a{display:block;padding:12px;margin:10px 0;color:#fff;text-decoration:none;border-radius:10px;transition:.25s}
.sidebar a:hover{background:rgba(255,255,255,.18);transform:translateX(6px)}
.toggle{margin-top:20px;display:flex;align-items:center;gap:8px}

.main{flex:1;padding:24px}
.page{display:none;animation:fade .5s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.section{background:var(--card);padding:14px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.08)}

input,select{padding:10px;margin:6px;width:100%;border-radius:10px;border:1px solid #cbd5f5;background:transparent;color:var(--text)}

button{background:linear-gradient(90deg,#06b6d4,#3b82f6);color:#fff;border:none;padding:12px 22px;border-radius:12px;cursor:pointer;transition:.2s}
button:hover{transform:scale(1.05)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{padding:14px;border-radius:14px;background:var(--card);box-shadow:0 8px 20px rgba(0,0,0,.1);animation:pop .45s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

.profit{color:var(--good);font-weight:700}
.loss{color:var(--bad);font-weight:700}
.small{color:var(--muted);font-size:13px}
.suggest{margin-top:10px;padding:12px;border-radius:12px;background:rgba(99,102,241,.08)}

@media(max-width:900px){.sidebar{display:none}}
</style>
</head>

<body>
<div class="sidebar">
  <h2>Finance Planner</h2>
  <a onclick="showPage('form')">Planning</a>
  <a onclick="showPage('dashboard')">Dashboard</a>
  <div class="toggle">
    <input type="checkbox" id="mode" onchange="toggleMode()"> <label for="mode">Dark Mode</label>
  </div>
</div>

<div class="main">

<!-- FORM -->
<div id="form" class="page active">
  <h1>Your Financial Plan</h1>
  <p class="small">Personalized based on your inputs</p>

  <div class="grid">
    <div class="section">
      <h3>Income</h3>
      <input type="number" id="income" placeholder="Monthly Income">
    </div>

    <div class="section">
      <h3>Housing</h3>
      <select id="rentYes" onchange="toggleField('rentYes','rent')"><option>No Rent</option><option>Paying Rent</option></select>
      <input type="number" id="rent" placeholder="Rent" disabled>
      <select id="homeYes" onchange="toggleField('homeYes','homeEmi')"><option>No EMI</option><option>Home EMI</option></select>
      <input type="number" id="homeEmi" placeholder="Home EMI" disabled>
    </div>

    <div class="section">
      <h3>Vehicle</h3>
      <select id="vehicleYes" onchange="toggleField('vehicleYes','vehicleEmi')"><option>No EMI</option><option>Vehicle EMI</option></select>
      <input type="number" id="vehicleEmi" placeholder="Vehicle EMI" disabled>
      <input type="number" id="petrol" placeholder="Fuel / Maintenance">
    </div>

    <div class="section">
      <h3>Health</h3>
      <select id="insuranceYes" onchange="toggleField('insuranceYes','insurance')"><option>No Insurance</option><option>Has Insurance</option></select>
      <input type="number" id="insurance" placeholder="Insurance" disabled>
      <input type="number" id="medical" placeholder="Medical">
    </div>

    <div class="section">
      <h3>Other</h3>
      <input type="number" id="food" placeholder="Food">
      <input type="number" id="education" placeholder="Education">
      <input type="number" id="bills" placeholder="Bills">
      <input type="number" id="shopping" placeholder="Shopping">
      <input type="number" id="gifts" placeholder="Gifts / Functions">
    </div>
  </div>

  <br>
  <button onclick="calculate()">Generate Smart Plan</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page">
  <h1>Financial Summary</h1>

  <div class="cards">
    <div class="card">Income: ₹<span id="inc"></span></div>
    <div class="card">Expenses: ₹<span id="exp"></span></div>
    <div class="card">Savings: ₹<span id="sav"></span></div>
    <div class="card">Emergency: ₹<span id="emg"></span></div>
    <div class="card">Investment: ₹<span id="inv"></span></div>
  </div>

  <h3 id="market"></h3>

  <canvas id="barChart"></canvas>

  <div id="suggestions" class="suggest"></div>
</div>

</div>

<script>
let chartInstance = null;

function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
function toggleMode(){document.body.classList.toggle('dark')}
function toggleField(s,i){document.getElementById(i).disabled=document.getElementById(s).value.includes('No')}

async function calculate(){

 let data = {
  income: get('income'),
  rent: get('rent'),
  homeEmi: get('homeEmi'),
  vehicleEmi: get('vehicleEmi'),
  petrol: get('petrol'),
  food: get('food'),
  education: get('education'),
  bills: get('bills'),
  shopping: get('shopping'),
  gifts: get('gifts'),
  insurance: get('insurance'),
  medical: get('medical')
 };

 let res = await fetch("http://localhost:5000", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(data)
 });

 let result = await res.json();

 set('inc', result.income);
 set('exp', result.totalExpenses);
 set('sav', result.savings);
 set('emg', result.emergency);
 set('inv', result.investment);

 // Destroy previous chart if exists
 if (chartInstance) {
  chartInstance.destroy();
 }

 // Create new chart with expense data
 let expenseData = [
  result.rent || 0,
  result.homeEmi || 0,
  result.vehicleEmi || 0,
  result.petrol || 0,
  result.food || 0,
  result.education || 0,
  result.bills || 0,
  result.shopping || 0,
  result.gifts || 0,
  result.insurance || 0,
  result.medical || 0
 ];

 let labels = ['Rent', 'Home EMI', 'Vehicle EMI', 'Petrol', 'Food', 'Education', 'Bills', 'Shopping', 'Gifts', 'Insurance', 'Medical'];

 chartInstance = new Chart(document.getElementById('barChart'), {
  type: 'bar',
  data: {
   labels: labels,
   datasets: [{
    label: 'Expenses',
    data: expenseData,
    backgroundColor: '#6366f1'
   }]
  }
 });

 showPage('dashboard');
}

function set(id,val){document.getElementById(id).innerText=val}
function get(id){return +document.getElementById(id).value||0}
</script>

</body>
</html>
